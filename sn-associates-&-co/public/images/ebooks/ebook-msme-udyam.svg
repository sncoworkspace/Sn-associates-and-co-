<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <linearGradient id="bg-ebook-msme-udyam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="accent-ebook-msme-udyam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="520" fill="url(#bg-ebook-msme-udyam)" rx="16" />

  <!-- Subtle Geometric Grid/Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.5">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="520" />
    <line x1="320" y1="0" x2="320" y2="520" />
    <line x1="480" y1="0" x2="480" y2="520" />
    <line x1="640" y1="0" x2="640" y2="520" />
  </g>

  <!-- Decorative Glow Circles -->
  <circle cx="720" cy="80" r="140" fill="#fbbf24" opacity="0.12" filter="blur(40px)" />
  <circle cx="80" cy="460" r="100" fill="#fbbf24" opacity="0.1" filter="blur(30px)" />

  <!-- Header Brand Bar -->
  <g transform="translate(48, 48)">
    <rect width="210" height="28" rx="6" fill="#ffffff" fill-opacity="0.12" />
    <text x="14" y="19" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1.5">
      SN ASSOCIATES &amp; CO.
    </text>
  </g>

  <!-- Category Badge -->
  <g transform="translate(48, 96)">
    <rect width="226" height="32" rx="16" fill="#fbbf24" fill-opacity="0.18" stroke="#fbbf24" stroke-width="1.5" />
    <circle cx="16" cy="16" r="4" fill="#fbbf24" />
    <text x="28" y="21" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">
      UDYAM MSME RECOGNITION
    </text>
  </g>

  <!-- Main Title -->
  <g transform="translate(48, 175)">
    <text fill="#ffffff" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5" filter="url(#shadow)">
      MSME Udyam Registration Step-by-...
    </text>
  </g>

  <!-- Subtitle / Practical Summary -->
  <g transform="translate(48, 225)">
    <text fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" opacity="0.9">
      Govt Subsidies, Collateral-Free Loans &amp; Benefits
    </text>
  </g>

  <!-- Feature Divider Line -->
  <line x1="48" y1="260" x2="752" y2="260" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1" />

  <!-- Pillars / Feature Tags -->
  <g transform="translate(48, 290)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="210" height="42" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
    <text x="18" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
      ✓ Statutory Checklist
    </text>

    <!-- Pill 2 -->
    <rect x="226" y="0" width="220" height="42" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
    <text x="244" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
      ✓ Zero-Error Templates
    </text>

    <!-- Pill 3 -->
    <rect x="462" y="0" width="220" height="42" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
    <text x="480" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
      ✓ Lifetime Portal Access
    </text>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(48, 410)">
    <!-- Author / Firm Badge -->
    <rect x="0" y="0" width="340" height="52" rx="12" fill="#000000" fill-opacity="0.25" border="1" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="20" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="1">
      AUTHORED BY CA &amp; LEGAL CELL
    </text>
    <text x="20" y="42" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">
      Team SN Associates &amp; Co, Bangalore
    </text>

    <!-- Official Verification Badge (Amount Removed for dynamic UI pricing) -->
    <g transform="translate(540, 0)">
      <rect x="0" y="0" width="164" height="52" rx="12" fill="#fbbf24" />
      <text x="82" y="23" text-anchor="middle" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="900" letter-spacing="1.5">
        OFFICIAL
      </text>
      <text x="82" y="41" text-anchor="middle" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="800" letter-spacing="0.5">
        VERIFIED EDITION
      </text>
    </g>
  </g>
</svg>